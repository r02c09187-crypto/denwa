<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebRTC 通話アプリ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Inter & Noto Sans JP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
      overflow-x: hidden;
    }

    /* 映像の反転（自分のカメラ映像を鏡のように表示） */
    .mirror-video {
      transform: scaleX(-1);
    }

    /* 通話中のパルスアニメーション */
    @keyframes pulse-ring {
      0% {
        transform: scale(0.85);
        opacity: 0.7;
      }
      70% {
        transform: scale(1.3);
        opacity: 0;
      }
      100% {
        transform: scale(1.3);
        opacity: 0;
      }
    }

    .pulse-circle {
      animation: pulse-ring 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }

    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #18181b;
    }
    ::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 bg-gradient-to-b from-zinc-950 via-zinc-900 to-zinc-950">

  <!-- メインコンテナ（スマホの通話画面のような洗練されたカードUI） -->
  <main class="w-full max-w-md sm:max-w-lg bg-zinc-900/90 backdrop-blur-xl border border-zinc-800/80 rounded-3xl shadow-2xl overflow-hidden flex flex-col relative">
    
    <!-- ヘッダー領域 -->
    <header class="px-5 py-4 border-b border-zinc-800/80 flex items-center justify-between bg-zinc-950/40">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-2xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
          <i data-lucide="phone-call" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-white">P2P コール</h1>
          <p class="text-[11px] text-zinc-400">暗号化ダイレクト通話</p>
        </div>
      </div>

      <!-- 接続ステータスバッジ & 通話時間タイマー -->
      <div class="flex items-center gap-2">
        <span id="call-timer" class="hidden font-mono text-xs font-semibold text-zinc-300 bg-zinc-800/90 px-2.5 py-1 rounded-full border border-zinc-700/60">
          00:00
        </span>
        <div id="status-badge" class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-zinc-800 text-zinc-300 border border-zinc-700/60">
          <span id="status-dot" class="w-2 h-2 rounded-full bg-zinc-500"></span>
          <span id="status-text">待機中</span>
        </div>
      </div>
    </header>

    <!-- メディア権限警告・案内バナー（権限がない場合などに表示） -->
    <div id="permission-banner" class="hidden mx-4 mt-4 p-3.5 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-200 text-xs leading-relaxed flex items-start gap-3">
      <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-400 shrink-0 mt-0.5"></i>
      <div class="flex-1">
        <p class="font-semibold text-amber-300 mb-0.5" id="permission-title">カメラ・マイクにアクセスできません</p>
        <p id="permission-desc">ブラウザの権限設定を確認してください。権限がない場合でも、受信専用モードとして通話に参加できます。</p>
      </div>
    </div>

    <!-- ビデオ・音声通話表示エリア -->
    <section class="relative w-full aspect-[4/3] sm:aspect-video bg-zinc-950 overflow-hidden flex items-center justify-center">
      
      <!-- リモート映像（相手の画面） -->
      <video id="remote-video" autoplay playsinline class="w-full h-full object-cover hidden"></video>

      <!-- リモート音声のみ / 待機中アバター表示 -->
      <div id="remote-placeholder" class="flex flex-col items-center justify-center p-6 text-center z-10">
        <div class="relative flex items-center justify-center mb-4">
          <!-- 通話中・呼び出し中の波紋アニメーション -->
          <div id="avatar-pulse" class="hidden absolute w-24 h-24 rounded-full bg-emerald-500/30 pulse-circle"></div>
          <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-zinc-800/90 border-2 border-zinc-700/80 flex items-center justify-center shadow-inner relative z-10">
            <i id="remote-avatar-icon" data-lucide="user" class="w-10 h-10 text-zinc-400"></i>
          </div>
        </div>
        <p id="remote-status-label" class="text-sm font-semibold text-zinc-200">通話相手を待っています</p>
        <p id="remote-sub-label" class="text-xs text-zinc-500 mt-1">ルームを作成するか、IDを入力して参加してください</p>
      </div>

      <!-- ローカル映像（自分の画面 - ピクチャーインピクチャー風） -->
      <div id="local-video-container" class="absolute bottom-3 right-3 w-28 sm:w-36 aspect-[3/4] sm:aspect-video bg-zinc-900 rounded-2xl overflow-hidden border-2 border-zinc-700/80 shadow-xl z-20 transition-all duration-300">
        <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover mirror-video hidden"></video>
        <!-- 自分のカメラがオフの時のプレースホルダー -->
        <div id="local-placeholder" class="w-full h-full flex flex-col items-center justify-center bg-zinc-800/90 text-zinc-400 p-2 text-center">
          <i data-lucide="video-off" class="w-5 h-5 mb-1 text-zinc-500"></i>
          <span class="text-[10px] font-medium">カメラオフ</span>
        </div>
        <!-- 自分のマイクミュートバッジ -->
        <div id="local-mute-badge" class="hidden absolute top-1.5 left-1.5 bg-rose-500/90 text-white p-1 rounded-full shadow">
          <i data-lucide="mic-off" class="w-3 h-3"></i>
        </div>
      </div>

      <!-- ルームIDオーバーレイ（通話・呼び出し中に表示） -->
      <div id="active-room-bar" class="hidden absolute top-3 left-3 right-3 z-20 flex items-center justify-between bg-zinc-950/75 backdrop-blur-md border border-zinc-800/90 px-3.5 py-2 rounded-2xl">
        <div class="flex items-center gap-2 overflow-hidden">
          <span class="text-[11px] text-zinc-400 shrink-0">ルームID:</span>
          <code id="display-room-id" class="text-xs font-mono font-bold text-emerald-400 truncate">---</code>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button id="copy-id-btn" type="button" class="flex items-center gap-1 px-2.5 py-1 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-zinc-200 transition active:scale-95" title="ルームIDをコピー">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
            <span>IDコピー</span>
          </button>
          <button id="copy-url-btn" type="button" class="flex items-center gap-1 px-2.5 py-1 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 text-xs font-medium transition active:scale-95" title="招待URLをコピー">
            <i data-lucide="link" class="w-3.5 h-3.5"></i>
            <span>URL</span>
          </button>
        </div>
      </div>
    </section>

    <!-- コントロール・操作パネル -->
    <section class="p-5 flex flex-col gap-5">
      
      <!-- モード選択 & メディア切り替えボタン -->
      <div class="flex items-center justify-between gap-2 bg-zinc-950/60 p-2 rounded-2xl border border-zinc-800/80">
        <!-- モード切り替え（音声電話モード / ビデオ通話モード） -->
        <div class="flex items-center bg-zinc-900 rounded-xl p-1 border border-zinc-800">
          <button id="mode-voice-btn" type="button" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-emerald-600 text-white shadow">
            <i data-lucide="phone" class="w-3.5 h-3.5"></i>
            <span>音声通話</span>
          </button>
          <button id="mode-video-btn" type="button" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition text-zinc-400 hover:text-zinc-200">
            <i data-lucide="video" class="w-3.5 h-3.5"></i>
            <span>ビデオ通話</span>
          </button>
        </div>

        <!-- マイク・カメラのオン/オフ個別トグル -->
        <div class="flex items-center gap-2">
          <button id="toggle-mic-btn" type="button" class="w-10 h-10 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-white flex items-center justify-center transition active:scale-95 border border-zinc-700/70" title="マイク オン/オフ">
            <i id="mic-icon" data-lucide="mic" class="w-4 h-4"></i>
          </button>
          <button id="toggle-cam-btn" type="button" class="w-10 h-10 rounded-xl bg-zinc-800/50 text-zinc-500 flex items-center justify-center transition active:scale-95 border border-zinc-800" title="カメラ オン/オフ">
            <i id="cam-icon" data-lucide="video-off" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- 待機中のアクションエリア（ルーム作成 または ルーム参加） -->
      <div id="lobby-controls" class="flex flex-col gap-4">
        <!-- 新しい通話ルームを作成ボタン -->
        <button id="create-room-btn" type="button" class="w-full py-3.5 px-4 rounded-2xl bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold text-sm shadow-lg shadow-emerald-950/50 transition flex items-center justify-center gap-2 cursor-pointer">
          <i data-lucide="plus-circle" class="w-5 h-5"></i>
          <span>新しい通話ルームを作成</span>
        </button>

        <div class="relative flex items-center py-1">
          <div class="flex-grow border-t border-zinc-800"></div>
          <span class="flex-shrink mx-3 text-xs text-zinc-500 font-medium">または</span>
          <div class="flex-grow border-t border-zinc-800"></div>
        </div>

        <!-- 既存のルームIDを入力して参加 -->
        <form id="join-room-form" class="flex flex-col sm:flex-row gap-2">
          <div class="relative flex-1">
            <input
              id="room-id-input"
              type="text"
              placeholder="ルームIDを入力 (例: ab12cd)"
              autocomplete="off"
              class="w-full bg-zinc-950 border border-zinc-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-2xl px-4 py-3 text-sm text-white placeholder-zinc-500 outline-none transition font-mono"
            />
          </div>
          <button id="join-room-btn" type="submit" class="py-3 px-5 rounded-2xl bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-white font-semibold text-sm border border-zinc-700/80 transition flex items-center justify-center gap-2 shrink-0 cursor-pointer">
            <i data-lucide="log-in" class="w-4 h-4 text-emerald-400"></i>
            <span>通話に参加</span>
          </button>
        </form>
      </div>

      <!-- 通話中・呼び出し中のアクションエリア（切断ボタン） -->
      <div id="incall-controls" class="hidden flex flex-col items-center gap-3 pt-1">
        <button id="hangup-btn" type="button" class="w-full py-3.5 px-6 rounded-2xl bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-bold text-sm shadow-lg shadow-rose-950/50 transition flex items-center justify-center gap-2 cursor-pointer">
          <i data-lucide="phone-off" class="w-5 h-5"></i>
          <span>通話を終了する</span>
        </button>
      </div>

    </section>
  </main>

  <!-- トースト通知用コンテナ（alert()の代わりに使用） -->
  <div id="toast-container" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none w-full max-w-sm px-4"></div>

  <!-- Firebase & WebRTC アプリケーションロジック -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      updateDoc,
      onSnapshot,
      collection,
      addDoc
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Lucideアイコンの初期描画
    lucide.createIcons();

    // ==========================================
    // 1. Firebase 初期化と認証設定
    // ==========================================
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-webrtc-app';
    let firebaseConfig = null;
    try {
      if (typeof __firebase_config !== 'undefined' && __firebase_config) {
        firebaseConfig = JSON.parse(__firebase_config);
      }
    } catch (e) {
      console.error("Firebase設定のパースに失敗しました:", e);
    }

    let app = null;
    let auth = null;
    let db = null;
    let currentUser = null;

    if (firebaseConfig) {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    }

    // 認証を完了させてから操作可能にする関数
    async function ensureAuth() {
      if (!auth) return null;
      if (currentUser) return currentUser;
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          const cred = await signInWithCustomToken(auth, __initial_auth_token);
          currentUser = cred.user;
        } else {
          const cred = await signInAnonymously(auth);
          currentUser = cred.user;
        }
        return currentUser;
      } catch (err) {
        console.error("Firebase認証エラー:", err);
        showToast("サーバー認証に失敗しました。再読み込みしてください。", "error");
        return null;
      }
    }

    // ==========================================
    // 2. アプリケーション状態とDOM要素
    // ==========================================
    const state = {
      mode: 'voice', // 'voice' (音声のみ) または 'video' (ビデオ通話)
      micEnabled: true,
      camEnabled: false,
      callStatus: 'idle', // 'idle' | 'calling' | 'connected'
      roomId: null,
      localStream: null,
      remoteStream: null,
      peerConnection: null,
      unsubscribers: [], // Firestoreのリスナー解除用
      timerInterval: null,
      callSeconds: 0,
      hasMediaPermission: false
    };

    // STUNサーバー設定（NAT越え用）
    const rtcConfig = {
      iceServers: [
        { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }
      ],
      iceCandidatePoolSize: 10
    };

    // DOM参照
    const el = {
      statusDot: document.getElementById('status-dot'),
      statusText: document.getElementById('status-text'),
      callTimer: document.getElementById('call-timer'),
      permissionBanner: document.getElementById('permission-banner'),
      permissionTitle: document.getElementById('permission-title'),
      permissionDesc: document.getElementById('permission-desc'),
      remoteVideo: document.getElementById('remote-video'),
      remotePlaceholder: document.getElementById('remote-placeholder'),
      avatarPulse: document.getElementById('avatar-pulse'),
      remoteAvatarIcon: document.getElementById('remote-avatar-icon'),
      remoteStatusLabel: document.getElementById('remote-status-label'),
      remoteSubLabel: document.getElementById('remote-sub-label'),
      localVideo: document.getElementById('local-video'),
      localPlaceholder: document.getElementById('local-placeholder'),
      localMuteBadge: document.getElementById('local-mute-badge'),
      activeRoomBar: document.getElementById('active-room-bar'),
      displayRoomId: document.getElementById('display-room-id'),
      copyIdBtn: document.getElementById('copy-id-btn'),
      copyUrlBtn: document.getElementById('copy-url-btn'),
      modeVoiceBtn: document.getElementById('mode-voice-btn'),
      modeVideoBtn: document.getElementById('mode-video-btn'),
      toggleMicBtn: document.getElementById('toggle-mic-btn'),
      toggleCamBtn: document.getElementById('toggle-cam-btn'),
      lobbyControls: document.getElementById('lobby-controls'),
      incallControls: document.getElementById('incall-controls'),
      createRoomBtn: document.getElementById('create-room-btn'),
      joinRoomForm: document.getElementById('join-room-form'),
      roomIdInput: document.getElementById('room-id-input'),
      hangupBtn: document.getElementById('hangup-btn'),
      toastContainer: document.getElementById('toast-container')
    };

    // ==========================================
    // 3. UIヘルパー関数
    // ==========================================
    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      const colors = {
        info: 'bg-zinc-800 border-zinc-700 text-zinc-100',
        success: 'bg-emerald-950/95 border-emerald-500/40 text-emerald-200',
        error: 'bg-rose-950/95 border-rose-500/40 text-rose-200'
      };
      toast.className = `px-4 py-2.5 rounded-2xl border shadow-xl text-xs font-medium backdrop-blur-md transition-all duration-300 transform translate-y-2 opacity-0 ${colors[type] || colors.info}`;
      toast.textContent = message;
      el.toastContainer.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // クリップボードコピー（iFrame制限対策でexecCommandを使用）
    function copyTextToClipboard(text, successMsg) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(successMsg, 'success');
      } catch (err) {
        showToast('コピーに失敗しました', 'error');
      }
      document.body.removeChild(textarea);
    }

    // 通話ステータス更新
    function updateCallStatus(status) {
      state.callStatus = status;

      if (status === 'idle') {
        el.statusDot.className = 'w-2 h-2 rounded-full bg-zinc-500';
        el.statusText.textContent = '待機中';
        el.callTimer.classList.add('hidden');
        el.lobbyControls.classList.remove('hidden');
        el.incallControls.classList.add('hidden');
        el.activeRoomBar.classList.add('hidden');
        el.avatarPulse.classList.add('hidden');
        el.remoteStatusLabel.textContent = '通話相手を待っています';
        el.remoteSubLabel.textContent = 'ルームを作成するか、IDを入力して参加してください';
        stopTimer();
      } else if (status === 'calling') {
        el.statusDot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-ping';
        el.statusText.textContent = '呼び出し中';
        el.lobbyControls.classList.add('hidden');
        el.incallControls.classList.remove('hidden');
        el.activeRoomBar.classList.remove('hidden');
        el.avatarPulse.classList.remove('hidden');
        el.remoteStatusLabel.textContent = '相手の参加を待っています...';
        el.remoteSubLabel.textContent = 'ルームIDまたはURLを相手に共有してください';
      } else if (status === 'connected') {
        el.statusDot.className = 'w-2 h-2 rounded-full bg-emerald-400';
        el.statusText.textContent = '通話中';
        el.callTimer.classList.remove('hidden');
        el.lobbyControls.classList.add('hidden');
        el.incallControls.classList.remove('hidden');
        el.activeRoomBar.classList.remove('hidden');
        el.avatarPulse.classList.remove('hidden');
        el.remoteStatusLabel.textContent = '通話中';
        el.remoteSubLabel.textContent = '音声・映像が接続されました';
        startTimer();
      }
    }

    function startTimer() {
      stopTimer();
      state.callSeconds = 0;
      el.callTimer.textContent = '00:00';
      state.timerInterval = setInterval(() => {
        state.callSeconds++;
        const mins = String(Math.floor(state.callSeconds / 60)).padStart(2, '0');
        const secs = String(state.callSeconds % 60).padStart(2, '0');
        el.callTimer.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
      state.callSeconds = 0;
    }

    // マイク・カメラボタンの見た目更新
    function updateMediaButtonsUI() {
      // モードボタン
      if (state.mode === 'voice') {
        el.modeVoiceBtn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-emerald-600 text-white shadow';
        el.modeVideoBtn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition text-zinc-400 hover:text-zinc-200';
      } else {
        el.modeVideoBtn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-emerald-600 text-white shadow';
        el.modeVoiceBtn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition text-zinc-400 hover:text-zinc-200';
      }

      // マイクボタン
      if (state.micEnabled) {
        el.toggleMicBtn.className = 'w-10 h-10 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-white flex items-center justify-center transition active:scale-95 border border-zinc-700/70';
        el.toggleMicBtn.innerHTML = '<i data-lucide="mic" class="w-4 h-4"></i>';
        el.localMuteBadge.classList.add('hidden');
      } else {
        el.toggleMicBtn.className = 'w-10 h-10 rounded-xl bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 flex items-center justify-center transition active:scale-95 border border-rose-500/40';
        el.toggleMicBtn.innerHTML = '<i data-lucide="mic-off" class="w-4 h-4"></i>';
        el.localMuteBadge.classList.remove('hidden');
      }

      // カメラボタン
      if (state.camEnabled) {
        el.toggleCamBtn.className = 'w-10 h-10 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-white flex items-center justify-center transition active:scale-95 border border-zinc-700/70';
        el.toggleCamBtn.innerHTML = '<i data-lucide="video" class="w-4 h-4"></i>';
      } else {
        el.toggleCamBtn.className = 'w-10 h-10 rounded-xl bg-zinc-800/50 hover:bg-zinc-800 text-zinc-500 flex items-center justify-center transition active:scale-95 border border-zinc-800';
        el.toggleCamBtn.innerHTML = '<i data-lucide="video-off" class="w-4 h-4"></i>';
      }

      // ローカルビデオの表示切替
      const hasActiveVideoTrack = state.localStream && state.localStream.getVideoTracks().some(t => t.enabled);
      if (state.camEnabled && hasActiveVideoTrack) {
        el.localVideo.classList.remove('hidden');
        el.localPlaceholder.classList.add('hidden');
      } else {
        el.localVideo.classList.add('hidden');
        el.localPlaceholder.classList.remove('hidden');
      }

      lucide.createIcons();
    }

    // ==========================================
    // 4. カメラ・マイクの取得と制御（フォールバック付き）
    // ==========================================
    async function initLocalMedia(requestVideo = false) {
      // 既存ストリームがあれば一度停止
      if (state.localStream) {
        state.localStream.getTracks().forEach(track => track.stop());
        state.localStream = null;
      }

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("このブラウザ環境ではメディアデバイスがサポートされていません。");
        }

        const constraints = {
          audio: true,
          video: requestVideo ? { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } : false
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        state.localStream = stream;
        state.hasMediaPermission = true;
        el.permissionBanner.classList.add('hidden');

        // トラックの有効状態を現在のUI状態に合わせる
        stream.getAudioTracks().forEach(t => (t.enabled = state.micEnabled));
        stream.getVideoTracks().forEach(t => (t.enabled = state.camEnabled));

        el.localVideo.srcObject = stream;
        updateMediaButtonsUI();
        return stream;

      } catch (err) {
        console.warn("メディア取得エラー（フォールバック実行）:", err);
        state.hasMediaPermission = false;
        state.camEnabled = false;
        
        // プレビュー環境や権限拒否時でもクラッシュさせず案内を表示
        el.permissionBanner.classList.remove('hidden');
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          el.permissionTitle.textContent = "マイク・カメラの許可が必要です";
          el.permissionDesc.textContent = "ブラウザのアドレスバー等から権限を許可してください。現在も受信専用（相手の音声・映像の視聴）として通話に参加できます。";
        } else if (err.name === 'NotFoundError') {
          el.permissionTitle.textContent = "マイクまたはカメラが見つかりません";
          el.permissionDesc.textContent = "デバイスが接続されていないため、受信専用モードで動作します。";
        } else {
          el.permissionTitle.textContent = "プレビュー環境の制限によりメディアを取得できません";
          el.permissionDesc.textContent = "新しいタブで開くか権限を許可すると音声・映像を送信できます。このままでも相手の通話を受信できます。";
        }

        updateMediaButtonsUI();
        return null;
      }
    }

    // モード切り替え（音声電話 <-> ビデオ通話）
    async function setCallMode(newMode) {
      if (state.mode === newMode) return;
      state.mode = newMode;

      if (newMode === 'voice') {
        state.camEnabled = false;
        if (state.localStream) {
          state.localStream.getVideoTracks().forEach(t => (t.enabled = false));
        }
        updateMediaButtonsUI();
      } else {
        state.camEnabled = true;
        // カメラトラックがまだ無い場合は再取得してPeerConnectionへ差し替え
        const hasVideoTrack = state.localStream && state.localStream.getVideoTracks().length > 0;
        if (!hasVideoTrack) {
          const newStream = await initLocalMedia(true);
          if (newStream && state.peerConnection) {
            const videoTrack = newStream.getVideoTracks()[0];
            if (videoTrack) {
              const sender = state.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
              if (sender) {
                await sender.replaceTrack(videoTrack);
              } else {
                state.peerConnection.addTrack(videoTrack, newStream);
              }
            }
          }
        } else {
          state.localStream.getVideoTracks().forEach(t => (t.enabled = true));
          updateMediaButtonsUI();
        }
      }
    }

    // マイクオン/オフ切り替え
    async function toggleMic() {
      if (!state.localStream) {
        await initLocalMedia(state.camEnabled);
      }
      state.micEnabled = !state.micEnabled;
      if (state.localStream) {
        state.localStream.getAudioTracks().forEach(t => (t.enabled = state.micEnabled));
      }
      updateMediaButtonsUI();
    }

    // カメラオン/オフ切り替え
    async function toggleCam() {
      if (!state.camEnabled) {
        // カメラをオンにする
        state.mode = 'video';
        state.camEnabled = true;
        const hasVideoTrack = state.localStream && state.localStream.getVideoTracks().length > 0;
        if (!hasVideoTrack) {
          const newStream = await initLocalMedia(true);
          if (newStream && state.peerConnection) {
            const videoTrack = newStream.getVideoTracks()[0];
            if (videoTrack) {
              const sender = state.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
              if (sender) {
                await sender.replaceTrack(videoTrack);
              } else {
                state.peerConnection.addTrack(videoTrack, newStream);
              }
            }
          }
        } else {
          state.localStream.getVideoTracks().forEach(t => (t.enabled = true));
          updateMediaButtonsUI();
        }
      } else {
        // カメラをオフにする
        state.camEnabled = false;
        if (state.localStream) {
          state.localStream.getVideoTracks().forEach(t => (t.enabled = false));
        }
        updateMediaButtonsUI();
      }
    }

    // ==========================================
    // 5. WebRTC & Firestore シグナリング処理
    // ==========================================
    function setupPeerConnection() {
      const pc = new RTCPeerConnection(rtcConfig);
      state.peerConnection = pc;

      // ローカルトラックを追加（権限がない場合は受信専用トランシーバーを追加）
      if (state.localStream) {
        state.localStream.getTracks().forEach(track => {
          pc.addTrack(track, state.localStream);
        });
      } else {
        pc.addTransceiver('audio', { direction: 'recvonly' });
        pc.addTransceiver('video', { direction: 'recvonly' });
      }

      // リモートストリームの準備
      const remoteStream = new MediaStream();
      state.remoteStream = remoteStream;
      el.remoteVideo.srcObject = remoteStream;

      // 相手からトラックを受信した時の処理
      pc.ontrack = (event) => {
        event.streams[0].getTracks().forEach(track => {
          remoteStream.addTrack(track);
        });
        checkRemoteVideoVisibility();
      };

      // 接続状態の変化を監視
      pc.onconnectionstatechange = () => {
        console.log("WebRTC接続状態:", pc.connectionState);
        if (pc.connectionState === 'connected') {
          updateCallStatus('connected');
          showToast('通話が接続されました！', 'success');
        } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed' || pc.connectionState === 'closed') {
          if (state.callStatus !== 'idle') {
            showToast('通話が切断されました', 'info');
            hangUp(false);
          }
        }
      };

      return pc;
    }

    // 相手の映像トラックがあるか判定してビデオ表示/アバター表示を切り替え
    function checkRemoteVideoVisibility() {
      if (!state.remoteStream) return;
      const videoTracks = state.remoteStream.getVideoTracks();
      const hasLiveVideo = videoTracks.length > 0 && videoTracks.some(t => t.readyState === 'live');
      if (hasLiveVideo) {
        el.remoteVideo.classList.remove('hidden');
        el.remotePlaceholder.classList.add('hidden');
      } else {
        el.remoteVideo.classList.add('hidden');
        el.remotePlaceholder.classList.remove('hidden');
      }
    }

    // 短く読みやすいルームIDを生成（例: 6文字英数字）
    function generateShortRoomId() {
      const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
      let result = '';
      for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    // 【発信側】新しい通話ルームを作成
    async function createRoom() {
      if (!db) {
        showToast("データベース設定が見つかりません", "error");
        return;
      }

      el.createRoomBtn.disabled = true;
      const user = await ensureAuth();
      if (!user) {
        el.createRoomBtn.disabled = false;
        return;
      }

      // メディア未取得なら取得を試みる
      if (!state.localStream && !state.hasMediaPermission) {
        await initLocalMedia(state.mode === 'video');
      }

      try {
        const roomId = generateShortRoomId();
        state.roomId = roomId;
        el.displayRoomId.textContent = roomId;

        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'webrtc_rooms', roomId);
        const callerCandidatesCol = collection(db, 'artifacts', appId, 'public', 'data', 'webrtc_rooms', roomId, 'callerCandidates');
        const calleeCandidatesCol = collection(db, 'artifacts', appId, 'public', 'data', 'webrtc_rooms', roomId, 'calleeCandidates');

        const pc = setupPeerConnection();

        // 自分のICE CandidateをFirestoreへ保存
        pc.onicecandidate = async (event) => {
          if (event.candidate) {
            try {
              await addDoc(callerCandidatesCol, event.candidate.toJSON());
            } catch (e) {
              console.error("Caller ICE保存エラー:", e);
            }
          }
        };

        // Offerを作成してFirestoreへ書き込み
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await setDoc(roomRef, {
          offer: {
            type: offer.type,
            sdp: offer.sdp
          },
          createdAt: Date.now(),
          creatorUid: user.uid,
          status: 'waiting'
        });

        updateCallStatus('calling');
        showToast(`ルーム「${roomId}」を作成しました`, 'success');

        // 相手からのAnswerを監視
        const unsubRoom = onSnapshot(roomRef, async (snapshot) => {
          const data = snapshot.data();
          if (!data) return;

          if (data.status === 'ended') {
            showToast('相手が通話を終了しました', 'info');
            hangUp(false);
            return;
          }

          if (!pc.currentRemoteDescription && data.answer) {
            const rtcSessionDescription = new RTCSessionDescription(data.answer);
            await pc.setRemoteDescription(rtcSessionDescription);
          }
        }, (err) => {
          console.error("ルーム監視エラー:", err);
        });

        // 相手のICE Candidateを監視
        const unsubCalleeCandidates = onSnapshot(calleeCandidatesCol, (snapshot) => {
          snapshot.docChanges().forEach(async (change) => {
            if (change.type === 'added') {
              const data = change.doc.data();
              try {
                await pc.addIceCandidate(new RTCIceCandidate(data));
              } catch (e) {
                console.error("Callee ICE追加エラー:", e);
              }
            }
          });
        }, (err) => {
          console.error("Callee ICE監視エラー:", err);
        });

        state.unsubscribers.push(unsubRoom, unsubCalleeCandidates);

      } catch (err) {
        console.error("ルーム作成エラー:", err);
        showToast("通話ルームの作成に失敗しました", "error");
        hangUp(false);
      } finally {
        el.createRoomBtn.disabled = false;
      }
    }

    // 【着信側】既存のルームIDを入力して参加
    async function joinRoom(inputRoomId) {
      const roomId = inputRoomId.trim().toLowerCase();
      if (!roomId) {
        showToast("ルームIDを入力してください", "error");
        return;
      }

      if (!db) {
        showToast("データベース設定が見つかりません", "error");
        return;
      }

      const user = await ensureAuth();
      if (!user) return;

      // メディア未取得なら取得を試みる
      if (!state.localStream && !state.hasMediaPermission) {
        await initLocalMedia(state.mode === 'video');
      }

      try {
        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'webrtc_rooms', roomId);
        const roomSnap = await getDoc(roomRef);

        if (!roomSnap.exists()) {
          showToast("指定されたルームIDが見つかりません", "error");
          return;
        }

        const roomData = roomSnap.data();
        if (roomData.status === 'ended') {
          showToast("この通話はすでに終了しています", "error");
          return;
        }

        state.roomId = roomId;
        el.displayRoomId.textContent = roomId;

        const callerCandidatesCol = collection(db, 'artifacts', appId, 'public', 'data', 'webrtc_rooms', roomId, 'callerCandidates');
        const calleeCandidatesCol = collection(db, 'artifacts', appId, 'public', 'data', 'webrtc_rooms', roomId, 'calleeCandidates');

        const pc = setupPeerConnection();

        // 自分のICE CandidateをFirestoreへ保存
        pc.onicecandidate = async (event) => {
          if (event.candidate) {
            try {
              await addDoc(calleeCandidatesCol, event.candidate.toJSON());
            } catch (e) {
              console.error("Callee ICE保存エラー:", e);
            }
          }
        };

        // 相手のOfferをセットし、Answerを作成して保存
        const offer = roomData.offer;
        await pc.setRemoteDescription(new RTCSessionDescription(offer));

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        await updateDoc(roomRef, {
          answer: {
            type: answer.type,
            sdp: answer.sdp
          },
          status: 'connected',
          calleeUid: user.uid
        });

        updateCallStatus('calling');

        // ルーム終了の監視
        const unsubRoom = onSnapshot(roomRef, (snapshot) => {
          const data = snapshot.data();
          if (data && data.status === 'ended') {
            showToast('相手が通話を終了しました', 'info');
            hangUp(false);
          }
        }, (err) => {
          console.error("ルーム監視エラー:", err);
        });

        // 発信側のICE Candidateを監視
        const unsubCallerCandidates = onSnapshot(callerCandidatesCol, (snapshot) => {
          snapshot.docChanges().forEach(async (change) => {
            if (change.type === 'added') {
              const data = change.doc.data();
              try {
                await pc.addIceCandidate(new RTCIceCandidate(data));
              } catch (e) {
                console.error("Caller ICE追加エラー:", e);
              }
            }
          });
        }, (err) => {
          console.error("Caller ICE監視エラー:", err);
        });

        state.unsubscribers.push(unsubRoom, unsubCallerCandidates);

      } catch (err) {
        console.error("ルーム参加エラー:", err);
        showToast("通話への参加に失敗しました", "error");
        hangUp(false);
      }
    }

    // 通話終了（切断）処理
    async function hangUp(notifyRemote = true) {
      // Firestoreリスナーの解除
      state.unsubscribers.forEach(unsub => {
        try { unsub(); } catch (e) {}
      });
      state.unsubscribers = [];

      // 相手に終了を通知
      if (notifyRemote && state.roomId && db && currentUser) {
        try {
          const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'webrtc_rooms', state.roomId);
          await updateDoc(roomRef, { status: 'ended' });
        } catch (e) {
          console.warn("終了ステータス更新スキップ:", e);
        }
      }

      // PeerConnectionクローズ
      if (state.peerConnection) {
        state.peerConnection.close();
        state.peerConnection = null;
      }

      // リモート映像リセット
      if (state.remoteStream) {
        state.remoteStream.getTracks().forEach(t => t.stop());
        state.remoteStream = null;
      }
      el.remoteVideo.srcObject = null;
      el.remoteVideo.classList.add('hidden');
      el.remotePlaceholder.classList.remove('hidden');

      state.roomId = null;
      updateCallStatus('idle');
    }

    // ==========================================
    // 6. イベントリスナー登録と初期化
    // ==========================================
    el.modeVoiceBtn.addEventListener('click', () => setCallMode('voice'));
    el.modeVideoBtn.addEventListener('click', () => setCallMode('video'));
    el.toggleMicBtn.addEventListener('click', toggleMic);
    el.toggleCamBtn.addEventListener('click', toggleCam);

    el.createRoomBtn.addEventListener('click', createRoom);

    el.joinRoomForm.addEventListener('submit', (e) => {
      e.preventDefault();
      joinRoom(el.roomIdInput.value);
    });

    el.hangupBtn.addEventListener('click', () => {
      hangUp(true);
      showToast('通話を終了しました', 'info');
    });

    el.copyIdBtn.addEventListener('click', () => {
      if (state.roomId) {
        copyTextToClipboard(state.roomId, `ルームID「${state.roomId}」をコピーしました`);
      }
    });

    el.copyUrlBtn.addEventListener('click', () => {
      if (state.roomId) {
        const url = new URL(window.location.href);
        url.searchParams.set('room', state.roomId);
        copyTextToClipboard(url.toString(), '招待URLをコピーしました');
      }
    });

    // ページ読み込み時の初期化
    window.addEventListener('DOMContentLoaded', async () => {
      // まず音声通話モード（マイクのみ）でメディア初期化を試みる
      await initLocalMedia(false);

      // URLパラメータに ?room=xxx が含まれていれば入力欄に自動セット
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');
      if (roomParam) {
        el.roomIdInput.value = roomParam;
        showToast(`ルームID「${roomParam}」が入力されました。「通話に参加」を押してください`, 'info');
      }
    });
  </script>
</body>
